name: Build and Push Backend Image

on:
  push:
    branches: [main]       # trigger on pushes to main
    paths:
      - 'my-medusa-store/apps/backend/**'   # only when backend code changes
  workflow_dispatch:      # allows manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/fescobar-2/medusa-codespace-backend:latest   # e.g., user/repo-backend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: my-medusa-store/apps/backend   # path to Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          #cache-from: type=gha
          #cache-to: type=gha,mode=max
